<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wyrm — Citation Network Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:        #080b0e;
  --bg2:       #0d1219;
  --bg3:       #121a23;
  --border:    #1c2730;
  --text:      #d4cbbf;
  --dim:       #6a7e8c;
  --amber:     #c8872a;
  --amber-hi:  #e8a840;
  --teal:      #267a6e;
  --teal-hi:   #38b09c;
  --crimson:   #b83030;
  --purple:    #7a4ab0;
  --font-d:    'Cormorant Garamond', Georgia, serif;
  --font-m:    'JetBrains Mono', 'Courier New', monospace;
}

/* ── RESET ──────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--font-m);font-size:13px}

/* ── SCROLLBARS ─────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── HEADER ─────────────────────────────────────────────── */
#hdr{
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
  position:relative;z-index:20;
  flex-shrink:0;
}

.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo-name{
  font-family:var(--font-d);font-size:26px;font-weight:600;
  letter-spacing:.1em;color:var(--amber);line-height:1
}
.logo-sub{
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-top:1px
}

.searchbar{
  flex:1;display:flex;gap:7px;max-width:580px
}
.searchbar input{
  flex:1;
  background:var(--bg3);border:1px solid var(--border);
  color:var(--text);font-family:var(--font-m);font-size:13px;
  padding:7px 11px;outline:none;
  transition:border-color .18s
}
.searchbar input:focus{border-color:var(--amber)}
.searchbar input::placeholder{color:var(--dim)}

.btn{
  background:transparent;border:1px solid var(--border);
  color:var(--dim);font-family:var(--font-m);font-size:11px;
  padding:6px 12px;cursor:pointer;letter-spacing:.06em;
  text-transform:uppercase;transition:all .15s;white-space:nowrap
}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.btn:disabled{opacity:.3;pointer-events:none}
.btn-p{background:var(--amber);border-color:var(--amber);color:#000;font-weight:500}
.btn-p:hover{background:var(--amber-hi);border-color:var(--amber-hi);color:#000}

.hdr-right{display:flex;gap:5px;margin-left:auto}

/* ── LAYOUT ────────────────────────────────────────────── */
#app{display:flex;height:calc(100vh - 53px)}

/* ── SIDEBAR ────────────────────────────────────────────── */
#sidebar{
  width:300px;min-width:300px;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  background:var(--bg2);overflow:hidden
}
#sb-head{
  padding:10px 14px;border-bottom:1px solid var(--border);
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0
}
#results{
  flex:1;overflow-y:auto;padding:6px 0
}

.r-item{
  padding:9px 14px;cursor:pointer;
  border-bottom:1px solid var(--border);
  border-left:3px solid transparent;
  transition:background .14s,border-color .14s
}
.r-item:hover{background:var(--bg3);border-left-color:var(--amber)}
.r-item.sel{background:var(--bg3);border-left-color:var(--amber)}

.r-title{
  font-family:var(--font-d);font-size:14px;
  line-height:1.38;color:var(--text);margin-bottom:3px
}
.r-meta{font-size:10.5px;color:var(--dim);line-height:1.5}
.r-badges{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}

.badge{
  font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;
  padding:1px 5px;border:1px solid;border-radius:2px
}
.badge.openalex       {border-color:var(--teal);    color:var(--teal-hi)}
.badge.semanticscholar{border-color:#7040b0;         color:#a880e8}
.badge.arxiv          {border-color:#9a401a;         color:#e87050}
.badge.crossref       {border-color:#405090;         color:#8098d8}
.badge.hcommons       {border-color:#408850;         color:#70c888}

.sb-placeholder{
  padding:28px 14px;text-align:center;color:var(--dim)
}
.sb-placeholder p{
  font-family:var(--font-d);font-size:14.5px;
  font-style:italic;line-height:1.65;opacity:.7
}

/* ── GRAPH AREA ─────────────────────────────────────────── */
#graph{flex:1;position:relative;overflow:hidden}
#gsvg{width:100%;height:100%}

/* ── EMPTY STATE ────────────────────────────────────────── */
#empty{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
  transition:opacity .3s
}
.e-title{
  font-family:var(--font-d);font-size:19px;font-style:italic;
  color:var(--dim);margin-top:14px;opacity:.6
}
.e-sub{
  font-size:10px;color:var(--dim);opacity:.35;
  margin-top:7px;letter-spacing:.12em;text-transform:uppercase
}

/* ── LOADING ────────────────────────────────────────────── */
#loading{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  display:none;flex-direction:column;align-items:center;gap:12px;
  z-index:30
}
#loading.on{display:flex}
.spin{width:46px;height:46px;animation:spin 1.6s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ltxt{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--amber);animation:pulse 1.6s ease-in-out infinite
}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ── DETAIL PANEL ───────────────────────────────────────── */
#detail{
  position:absolute;right:0;top:0;bottom:0;width:330px;
  background:var(--bg2);border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .22s ease;
  overflow-y:auto;z-index:10
}
#detail.open{transform:translateX(0)}
#d-bar{
  position:sticky;top:0;display:flex;
  justify-content:space-between;align-items:center;
  padding:9px 14px;border-bottom:1px solid var(--border);
  background:var(--bg2);z-index:1;
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)
}
#d-close{
  background:none;border:none;color:var(--dim);
  cursor:pointer;font-size:19px;line-height:1;padding:0 2px
}
#d-close:hover{color:var(--text)}
#d-body{padding:14px}
.d-title{
  font-family:var(--font-d);font-size:17px;font-weight:600;
  line-height:1.42;color:var(--text);margin-bottom:13px
}
.d-field{margin-bottom:10px}
.d-lbl{
  font-size:8.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--amber);margin-bottom:3px
}
.d-val{font-size:12px;color:var(--text);line-height:1.5}
.d-val a{color:var(--teal-hi);text-decoration:none}
.d-val a:hover{text-decoration:underline}
.d-acts{margin-top:14px;display:flex;flex-direction:column;gap:7px}

/* ── STATS BAR ──────────────────────────────────────────── */
#stats{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;align-items:center;gap:18px;
  padding:6px 14px;
  background:rgba(8,11,14,.85);backdrop-filter:blur(4px);
  border-top:1px solid var(--border);
  font-size:10.5px;color:var(--dim);pointer-events:none
}
.sv{color:var(--amber)}

/* ── ZOOM CONTROLS ──────────────────────────────────────── */
#zctrl{
  position:absolute;bottom:36px;right:14px;
  display:flex;flex-direction:column;gap:3px;z-index:10
}
.zbtn{
  width:30px;height:30px;background:var(--bg2);
  border:1px solid var(--border);color:var(--dim);
  cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .14s
}
.zbtn:hover{border-color:var(--amber);color:var(--amber)}

/* ── TOOLTIP ────────────────────────────────────────────── */
#tip{
  position:absolute;
  background:var(--bg2);border:1px solid var(--amber);
  padding:7px 11px;font-size:11.5px;max-width:250px;
  pointer-events:none;opacity:0;transition:opacity .14s;
  z-index:50;line-height:1.45
}
#tip.on{opacity:1}

/* ── TOAST ──────────────────────────────────────────────── */
#toast{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  background:var(--bg2);border:1px solid var(--amber);
  padding:7px 14px;font-size:11.5px;color:var(--amber);
  opacity:0;transition:opacity .25s;z-index:100;pointer-events:none;
  white-space:nowrap
}
#toast.on{opacity:1}

/* ── D3 ELEMENTS ────────────────────────────────────────── */
.link{stroke:#1c2730;stroke-opacity:.7;fill:none;stroke-width:1.2}
.link.hl{stroke:var(--amber);stroke-opacity:.8;stroke-width:1.5}
.node circle{cursor:pointer}
.node text{
  font-family:var(--font-m);font-size:9px;
  fill:var(--dim);pointer-events:none;
  text-anchor:middle
}
.node.selected circle{filter:drop-shadow(0 0 7px currentColor)}

/* legend */
#legend{
  position:absolute;top:12px;left:12px;
  background:rgba(13,18,25,.8);backdrop-filter:blur(4px);
  border:1px solid var(--border);padding:8px 11px;
  font-size:10px;color:var(--dim);
  display:none;flex-direction:column;gap:5px;z-index:5
}
#legend.on{display:flex}
.leg-row{display:flex;align-items:center;gap:7px}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>

<div id="hdr">
  <a class="logo" href="#" onclick="return false">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <circle cx="17" cy="17" r="13" stroke="#c8872a" stroke-width="1.8" fill="none" stroke-dasharray="66 14"/>
      <path d="M30 17C30 14.5 27.5 12.5 25 13.5L20.5 16" stroke="#c8872a" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="29" cy="16" r="1" fill="#c8872a"/>
    </svg>
    <div>
      <div class="logo-name">WYRM</div>
      <div class="logo-sub">Citation Network Explorer</div>
    </div>
  </a>

  <div class="searchbar">
    <input id="s-in" type="text" placeholder="Title, Author, DOI, or arXiv ID…" autocomplete="off">
    <button class="btn btn-p" id="s-btn">Search</button>
  </div>

  <div class="hdr-right">
    <button class="btn" id="dl-btn" disabled>↓ Export</button>
    <button class="btn" id="rst-btn">Reset</button>
    <button class="btn" id="leg-btn">Legend</button>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="sb-head">
      <span id="sb-lbl">Search Results</span>
      <span id="sb-cnt"></span>
    </div>
    <div id="results">
      <div class="sb-placeholder"><p>Search for a paper to trace its citation ancestry.</p></div>
    </div>
  </div>

  <div id="graph">
    <svg id="gsvg"></svg>
    <div id="empty">
      <div class="e-title">Select a paper to trace its wyrm</div>
      <div class="e-sub">Search · Select · Expand</div>
    </div>
    <div id="loading">
      <svg class="spin" width="46" height="46" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="17" stroke="#c8872a" stroke-width="2" fill="none" stroke-dasharray="72 26"/>
      </svg>
      <div class="ltxt" id="ltxt">Querying sources…</div>
    </div>
    <div id="detail">
      <div id="d-bar"><span>Paper Detail</span><button id="d-close">×</button></div>
      <div id="d-body"></div>
    </div>
    <div id="legend">
      <div class="leg-row"><div class="leg-dot" style="background:#b83030"></div><span>Root Paper</span></div>
      <div class="leg-row"><div class="leg-dot" style="background:#c8872a"></div><span>Depth 1</span></div>
      <div class="leg-row"><div class="leg-dot" style="background:#267a6e"></div><span>Depth 2</span></div>
      <div class="leg-row"><div class="leg-dot" style="background:#7a4ab0"></div><span>Depth 3+</span></div>
    </div>
    <div id="stats">
      <span>Nodes: <span class="sv" id="st-n">0</span></span>
      <span>Edges: <span class="sv" id="st-e">0</span></span>
      <span>Max depth: <span class="sv" id="st-d">0</span></span>
    </div>
    <div id="zctrl">
      <button class="zbtn" id="z-in">+</button>
      <button class="zbtn" id="z-out">−</button>
      <button class="zbtn" id="z-fit">⊡</button>
    </div>
    <div id="tip"></div>
    <div id="toast"></div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const CFG = {
  OA:   'https://api.openalex.org',
  SS:   'https://api.semanticscholar.org/graph/v1',
  AX:   'https://export.arxiv.org/api',
  CR:   'https://api.crossref.org',
  HC:   'https://hcommons.org/wp-json/wp/v2',
  PROXY: 'https://corsproxy.io/?',
  MAIL: 'wyrm-explorer@example.com',
  MAX_CITERS: 80,
};

const S = {
  nodes: new Map(),
  edges: [],
  rootId: null,
  sim: null,
  svg: null,
  zoom: null,
  g: null,
  selId: null,
  maxDepth: 0,
};
let _results = [];

// ── API HELPERS ──────────────────────────────────────────

async function jfetch(url, useProxy = false) {
  const finalUrl = useProxy ? CFG.PROXY + encodeURIComponent(url) : url;
  const r = await fetch(finalUrl, { headers: { 'Accept': 'application/json' } });
  if (r.status === 429) { toast("Rate limited by provider."); throw new Error(429); }
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function normalOA(w) {
  return {
    id:           'oa:' + w.id.replace('https://openalex.org/',''),
    openAlexId:   w.id.replace('https://openalex.org/',''),
    title:        w.title || '(Untitled)',
    authors:      (w.authorships||[]).slice(0,4).map(a=>a.author?.display_name).filter(Boolean).join(', '),
    year:         w.publication_year || null,
    doi:          w.doi ? w.doi.replace('https://doi.org/','') : null,
    citationCount:w.cited_by_count || 0,
    source:       'openalex',
    sources:      ['openalex'],
    venue:        w.primary_location?.source?.display_name || null,
    abstract:     w.abstract_inverted_index ? invertedToText(w.abstract_inverted_index) : null,
  };
}

function invertedToText(inv) {
  if (!inv) return null;
  const pairs = [];
  for (const [word, positions] of Object.entries(inv))
    for (const pos of positions) pairs.push([pos, word]);
  return pairs.sort((a,b)=>a[0]-b[0]).map(p=>p[1]).join(' ');
}

// ── SEARCH LOGIC ──────────────────────────────────────────

async function searchOA(q) {
  try {
    const d = await jfetch(`${CFG.OA}/works?search=${enc(q)}&per-page=12&mailto=${CFG.MAIL}`);
    return (d.results||[]).map(normalOA);
  } catch { return []; }
}

async function searchSS(q) {
  try {
    const d = await jfetch(`${CFG.SS}/paper/search?query=${enc(q)}&limit=10&fields=paperId,title,authors,year,citationCount,externalIds,venue`, true);
    return (d.data||[]).map(p=>({
      id:'ss:'+p.paperId, ssId:p.paperId,
      title:p.title||'(Untitled)',
      authors:(p.authors||[]).slice(0,4).map(a=>a.name).join(', '),
      year:p.year, doi:p.externalIds?.DOI||null,
      arxivId:p.externalIds?.ArXiv||null,
      citationCount:p.citationCount||0,
      source:'semanticscholar', sources:['semanticscholar'],
      venue:p.venue||null,
    }));
  } catch { return []; }
}

async function searchAX(q) {
  try {
    const url = `${CFG.AX}/query?search_query=all:${enc(q)}&max_results=7&sortBy=relevance`;
    const txt = await fetch(CFG.PROXY + encodeURIComponent(url)).then(r=>r.text());
    const xml = new DOMParser().parseFromString(txt,'application/xml');
    return Array.from(xml.querySelectorAll('entry')).map(e=>{
      const rawId = e.querySelector('id')?.textContent||'';
      const arxivId = rawId.includes('/abs/') ? rawId.split('/abs/').pop() : rawId;
      return {
        id:'ax:'+arxivId, arxivId,
        title:e.querySelector('title')?.textContent?.trim()||'(Untitled)',
        authors:Array.from(e.querySelectorAll('author name')).slice(0,4).map(n=>n.textContent).join(', '),
        year:(e.querySelector('published')?.textContent||'').slice(0,4),
        source:'arxiv', sources:['arxiv'], venue:'arXiv'
      };
    });
  } catch { return []; }
}

async function searchCR(q) {
  try {
    const d = await jfetch(`${CFG.CR}/works?query=${enc(q)}&rows=7`);
    return (d.message?.items||[]).map(w=>({
      id:'cr:'+(w.DOI||Math.random()),
      doi:w.DOI||null,
      title:Array.isArray(w.title)?w.title[0]:(w.title||'(Untitled)'),
      authors:(w.author||[]).slice(0,4).map(a=>[a.given,a.family].filter(Boolean).join(' ')).join(', '),
      year:w.published?.['date-parts']?.[0]?.[0]||null,
      citationCount:w['is-referenced-by-count']||0,
      source:'crossref', sources:['crossref'],
    }));
  } catch { return []; }
}

async function searchHC(q) {
  try {
    const d = await jfetch(`${CFG.HC}/posts?search=${enc(q)}&per_page=5`, true);
    return (d||[]).map(p=>({
      id:'hc:'+p.id, title:p.title?.rendered||'(Untitled)',
      authors:'', year:p.date?new Date(p.date).getFullYear():null,
      source:'hcommons', sources:['hcommons'], venue:'Humanities Commons',
    }));
  } catch { return []; }
}

function mergeResults(arrays) {
  const byDoi  = new Map();
  const byTitle= new Map();
  const out    = [];
  const normTitle = t => t.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,60);

  for (const arr of arrays) {
    for (const item of arr) {
      let existing = (item.doi ? byDoi.get(item.doi) : null) || byTitle.get(normTitle(item.title||''));
      if (existing) {
        (item.sources||[]).forEach(s => { if(!existing.sources.includes(s)) existing.sources.push(s); });
        if ((item.citationCount||0) > existing.citationCount) existing.citationCount = item.citationCount;
        if (item.openAlexId && !existing.openAlexId) existing.openAlexId = item.openAlexId;
        if (item.ssId && !existing.ssId) existing.ssId = item.ssId;
        if (item.arxivId && !existing.arxivId) existing.arxivId = item.arxivId;
      } else {
        item.sources = item.sources || [item.source];
        out.push(item);
        if (item.doi) byDoi.set(item.doi, item);
        byTitle.set(normTitle(item.title||''), item);
      }
    }
  }
  return out.sort((a,b)=>(b.citationCount||0)-(a.citationCount||0));
}

// ── CITATION FETCHER (PARALLEL) ──────────────────────────

async function getCitedBy(node) {
  const tasks = [];

  // 1. OpenAlex
  if (node.openAlexId) {
    tasks.push(jfetch(`${CFG.OA}/works?filter=cites:${node.openAlexId}&per-page=${CFG.MAX_CITERS}&mailto=${CFG.MAIL}`)
      .then(d => (d.results||[]).map(normalOA)).catch(()=>[]));
  }

  // 2. Semantic Scholar
  const ssTarget = node.ssId || (node.doi ? `DOI:${node.doi}` : (node.arxivId ? `arXiv:${node.arxivId}` : null));
  if (ssTarget) {
    tasks.push(jfetch(`${CFG.SS}/paper/${enc(ssTarget)}/citations?fields=paperId,title,authors,year,citationCount,externalIds,venue&limit=80`, true)
      .then(d => (d.data||[]).map(({citingPaper:p})=>({
        id:'ss:'+p.paperId, ssId:p.paperId,
        title:p.title||'(Untitled)',
        authors:(p.authors||[]).slice(0,4).map(a=>a.name).join(', '),
        year:p.year, doi:p.externalIds?.DOI||null,
        arxivId:p.externalIds?.ArXiv||null,
        citationCount:p.citationCount||0,
        source:'semanticscholar', sources:['semanticscholar'],
        venue:p.venue||null,
      }))).catch(()=>[]));
  }

  const results = await Promise.allSettled(tasks);
  return mergeResults(results.map(r => r.status==='fulfilled' ? r.value : []));
}

async function resolveOAId(node) {
  if (node.openAlexId) return node.openAlexId;
  if (!node.doi) return null;
  try {
    const d = await jfetch(`${CFG.OA}/works/https://doi.org/${node.doi}?select=id&mailto=${CFG.MAIL}`);
    return d.id?.replace('https://openalex.org/','') || null;
  } catch { return null; }
}

// ── GRAPH LOGIC ──────────────────────────────────────────

function addNode(data, depth) {
  if (S.nodes.has(data.id)) return;
  S.nodes.set(data.id, {...data, depth, expanded:false});
  if (depth > S.maxDepth) S.maxDepth = depth;
}

function addEdge(src, tgt) {
  if (!S.edges.some(e=>e.source===src&&e.target===tgt)) S.edges.push({source:src, target:tgt});
}

const DEPTH_COLORS = ['#b83030','#c8872a','#267a6e','#7a4ab0','#3a7a2a'];
const getRadius = n => n.depth===0 ? 18 : 7 + Math.min(Math.sqrt(n.citationCount||0)*0.55, 10);

function renderGraph() {
  const g = S.g; g.selectAll('*').remove();
  const nodes = Array.from(S.nodes.values());
  const edges = S.edges.map(e=>({...e}));
  if (nodes.length===0) { updateStats(); return; }
  document.getElementById('empty').style.opacity='0';

  const W = document.getElementById('gsvg').clientWidth, H = document.getElementById('gsvg').clientHeight;
  if (S.sim) S.sim.stop();
  S.sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id(d=>d.id).distance(d=>S.nodes.get(d.source.id||d.source)?.depth===0?130:75).strength(0.45))
    .force('charge', d3.forceManyBody().strength(-220))
    .force('center', d3.forceCenter(W/2, H/2))
    .force('collide', d3.forceCollide(d=>getRadius(d)+9));

  const link = g.append('g').selectAll('line').data(edges).enter().append('line').attr('class','link').attr('marker-end','url(#arr)');
  const node = g.append('g').selectAll('g').data(nodes, d=>d.id).enter().append('g').attr('class','node')
    .call(d3.drag().on('start',(e,d)=>{if(!e.active)S.sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)S.sim.alphaTarget(0);d.fx=null;d.fy=null}))
    .on('click', (e,d)=>{ e.stopPropagation(); selectNode(d.id); })
    .on('mouseover', showTip).on('mousemove', moveTip).on('mouseout', hideTip);

  node.append('circle').attr('r', d=>getRadius(d)).attr('fill', d=>DEPTH_COLORS[Math.min(d.depth,4)]).attr('stroke', d=>d.id===S.rootId?'#fff':null).attr('stroke-width', 2);
  node.append('text').attr('dy', d=>getRadius(d)+11).text(d=>d.title.slice(0,18)+'...').attr('font-size','9px');

  S.sim.on('tick', ()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
  updateStats();
}

// ── UI FLOW ──────────────────────────────────────────────

async function doSearch() {
  const q = document.getElementById('s-in').value.trim();
  if (!q) return;
  showLoad('Searching all sources...');
  try {
    const res = await Promise.allSettled([searchOA(q), searchSS(q), searchAX(q), searchCR(q), searchHC(q)]);
    const all = mergeResults(res.map(r=>r.status==='fulfilled'?r.value:[]));
    showResults(all);
  } finally { hideLoad(); }
}

function showResults(results) {
  _results = results;
  document.getElementById('sb-cnt').textContent = results.length;
  document.getElementById('results').innerHTML = results.map((r,i)=>`
    <div class="r-item" onclick="pickResult(${i})">
      <div class="r-title">${esc(r.title)}</div>
      <div class="r-meta">${r.year||'?'}${r.citationCount?` · ${r.citationCount} cit.`:''}</div>
      <div class="r-badges">${(r.sources||[]).map(s=>`<span class="badge ${s}">${s}</span>`).join('')}</div>
    </div>`).join('');
}

async function pickResult(i) {
  const paper = _results[i];
  S.nodes.clear(); S.edges.length=0; S.maxDepth=0; S.rootId = paper.id;
  showLoad('Building wyrm...');
  try {
    paper.openAlexId = await resolveOAId(paper);
    addNode(paper, 0); paper.expanded = true;
    const citers = await getCitedBy(paper);
    citers.forEach(c => { addNode(c, 1); addEdge(c.id, paper.id); });
    renderGraph();
    document.getElementById('dl-btn').disabled=false;
    setTimeout(()=>selectNode(paper.id), 100);
  } finally { hideLoad(); }
}

async function expandNode(id) {
  const nd = S.nodes.get(id); if (!nd || nd.expanded) return;
  showLoad('Expanding network...');
  try {
    nd.openAlexId = await resolveOAId(nd);
    const citers = await getCitedBy(nd);
    nd.expanded = true;
    let added = 0;
    citers.forEach(c => { if(!S.nodes.has(c.id)){ addNode(c, nd.depth+1); added++; } addEdge(c.id, id); });
    toast(`Added ${added} papers`); renderGraph();
    setTimeout(()=>selectNode(id), 100);
  } finally { hideLoad(); }
}

// ── UTILS ────────────────────────────────────────────────

function selectNode(id) {
  S.selId = id; const nd = S.nodes.get(id); if (nd) showDetail(nd);
  S.g.selectAll('.node').classed('selected', d=>d.id===id);
}

function showDetail(nd) {
  const expBtn = nd.expanded ? `<button class="btn" disabled>Expanded</button>` : `<button class="btn btn-p" onclick="expandNode('${nd.id}')">Fetch Citing Papers</button>`;
  document.getElementById('d-body').innerHTML = `
    <div class="d-title">${esc(nd.title)}</div>
    <div class="d-field"><div class="d-lbl">Authors</div><div class="d-val">${esc(nd.authors)}</div></div>
    <div class="d-field"><div class="d-lbl">Year</div><div class="d-val">${nd.year||'—'}</div></div>
    <div class="d-field"><div class="d-lbl">Citations</div><div class="d-val">${nd.citationCount}</div></div>
    <div class="d-field"><div class="d-lbl">DOI</div><div class="d-val">${nd.doi||'—'}</div></div>
    <div class="d-acts">${expBtn}</div>`;
  document.getElementById('detail').classList.add('open');
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function enc(s){ return encodeURIComponent(s); }
function showLoad(msg){ document.getElementById('ltxt').textContent=msg; document.getElementById('loading').classList.add('on'); }
function hideLoad(){ document.getElementById('loading').classList.remove('on'); }
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'), 2500); }
function updateStats() { document.getElementById('st-n').textContent = S.nodes.size; document.getElementById('st-e').textContent = S.edges.length; document.getElementById('st-d').textContent = S.maxDepth; }

function init() {
  S.svg = d3.select('#gsvg');
  S.zoom = d3.zoom().scaleExtent([0.1, 4]).on('zoom', e => S.g.attr('transform', e.transform));
  S.svg.call(S.zoom);
  S.svg.append('defs').append('marker').attr('id','arr').attr('viewBox','0 -5 10 10').attr('refX',20).attr('orient','auto').attr('markerWidth',5).attr('markerHeight',5).append('path').attr('d','M0,-5L10,0L0,5').attr('fill','#1c2730');
  S.g = S.svg.append('g');

  document.getElementById('s-btn').onclick = doSearch;
  document.getElementById('s-in').onkeydown = e => { if(e.key==='Enter') doSearch(); };
  document.getElementById('rst-btn').onclick = () => location.reload();
  document.getElementById('d-close').onclick = () => document.getElementById('detail').classList.remove('open');
  document.getElementById('z-in').onclick = () => S.svg.transition().call(S.zoom.scaleBy, 1.5);
  document.getElementById('z-out').onclick = () => S.svg.transition().call(S.zoom.scaleBy, 0.7);
  document.getElementById('z-fit').onclick = () => S.svg.transition().call(S.zoom.transform, d3.zoomIdentity);
  document.getElementById('leg-btn').onclick = () => { const l = document.getElementById('legend'); l.style.display = l.style.display==='flex'?'none':'flex'; };
}

function showTip(e, d) {
  const tip = document.getElementById('tip');
  tip.innerHTML = `<strong>${esc(d.title)}</strong><br>${d.year || ''}`;
  tip.classList.add('on'); moveTip(e);
}
function moveTip(e) {
  const tip = document.getElementById('tip');
  tip.style.left = (e.clientX + 15) + 'px';
  tip.style.top = (e.clientY + 15) + 'px';
}
function hideTip() { document.getElementById('tip').classList.remove('on'); }

init();
</script>
